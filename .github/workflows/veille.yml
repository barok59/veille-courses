name: veille-courses

on:
  schedule:
    - cron: "0 * * * *"      # scan complet, toutes les heures
    - cron: "*/5 * * * *"    # rappels seuls, sans requête vers les sites
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: veille
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    env:
      TZ: Europe/Paris
      DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests beautifulsoup4

      - run: python veille.py

      - name: Sauvegarder l'état
        run: |
          git config user.name "veille-bot"
          git config user.email "veille-bot@users.noreply.github.com"
          git add state.json
          git diff --staged --quiet || (git commit -m "maj état" && git push)
      
      - name: Lancer la veille
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
        run: python veille.py ${{ github.event.schedule == '*/5 * * * *' && 'rappels' || 'scan' }}
